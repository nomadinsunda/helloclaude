services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required (.env)}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required (.env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (.env)}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 이미지부터 PGDATA가 /var/lib/postgresql/18/docker이므로 상위 경로에 마운트한다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
